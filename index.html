<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Cuenta Regresiva</title>

<style>

body{
margin:0;
padding:0;
background:transparent;
font-family:Arial, Helvetica, sans-serif;
}

.card{

max-width:700px;
margin:auto;

background:#F8F4E8;

border:4px solid #9BC39A;

border-radius:25px;

padding:30px;

text-align:center;

box-shadow:0 10px 30px rgba(0,0,0,.10);

}

h2{

color:#5E5A52;

margin-bottom:25px;

}

.contador{

display:flex;

justify-content:space-around;

gap:15px;

flex-wrap:wrap;

}

.item{

background:white;

border-radius:18px;

padding:20px;

width:110px;

box-shadow:0 5px 15px rgba(0,0,0,.08);

}

.numero{

font-size:42px;

font-weight:bold;

color:#9BC39A;

transition:.3s;

}

.texto{

margin-top:10px;

color:#5E5A52;

font-size:18px;

}

.frase{

margin-top:25px;

font-style:italic;

color:#7A7A7A;

}

@media(max-width:600px){

.item{

width:42%;

margin-bottom:15px;

}

.numero{

font-size:34px;

}

}

</style>

</head>

<body>

<div class="card">

<h2>⏳ Faltan para conocerte</h2>

<div class="contador">

<div class="item">

<div class="numero" id="dias">0</div>

<div class="texto">Días</div>

</div>

<div class="item">

<div class="numero" id="horas">0</div>

<div class="texto">Horas</div>

</div>

<div class="item">

<div class="numero" id="minutos">0</div>

<div class="texto">Minutos</div>

</div>

<div class="item">

<div class="numero" id="segundos">0</div>

<div class="texto">Segundos</div>

</div>

</div>

<div class="frase">

💚 Cada segundo nos acerca más a este hermoso momento 💚

</div>

</div>

<script>

const fecha=new Date("2026-08-23T15:00:00").getTime();

function actualizar(){

const ahora=new Date().getTime();

const diferencia=fecha-ahora;

const dias=Math.floor(diferencia/(1000*60*60*24));

const horas=Math.floor((diferencia%(1000*60*60*24))/(1000*60*60));

const minutos=Math.floor((diferencia%(1000*60*60))/(1000*60));

const segundos=Math.floor((diferencia%(1000*60))/1000);

document.getElementById("dias").innerHTML=dias;

document.getElementById("horas").innerHTML=horas;

document.getElementById("minutos").innerHTML=minutos;

document.getElementById("segundos").innerHTML=segundos;

}

setInterval(actualizar,1000);

actualizar();

</script>

</body>

</html>
